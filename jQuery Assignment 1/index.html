<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery Assignment-1</title>
    <script src="script/jquery-4.0.0.min.js"></script>
    <script src="script/script.js"></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <h1>jQuery Assignment-1</h1>
    <hr>
    <h2>To-do list</h2><br>

    <button id="add-task">Add task</button>
    <p id="Message">No task to show.</p>

    <div class="overlay">
      <div class="popUp">
      <h3>Add task</h3>

      <form class="task-form">
        <label for="task-title">Task title</label>
        <input type="text" id="task-title" placeholder="enter task title" required/><br /><br />

        <label for="estimated-time">Estimated time</label>
        <input type="date" id="estimated-time" placeholder="enter estimated Time" required/><br /><br />

        <label for="priority">Priority</label>
        <select id="priority" required>
          <option value="top">top</option>
          <option value="medium">medium</option>
          <option value="least">least</option></select><br>
        <button type="submit">Add</button>
        <button type="submit" id="close-popup">Cancel</button>
      </form>
    </div>
    </div>

    <table class="task-list">
      <thead>
        <tr>
          <th>Task title</th>
          <th>Estimated time</th>
          <th>Priority</th>
          <th>status</th>
          <th>Delete</th>
        </tr>
      </thead>

      <tbody id="table-body"></tbody>
    </table>
  </body>
</html>
