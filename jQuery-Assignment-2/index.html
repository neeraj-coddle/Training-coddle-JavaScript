<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery Assignment-2</title>
    <script src="script/jquery-4.0.0.min.js"></script>
    <script src="script/script.js"></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <h2>Form</h2>

    <form id="signupForm">
      <label for="name">Name</label><br>
      <input type="text" id="name" placeholder="Enter name:" />
      <div class="nameError error"></div>
      <br>

      <label for="email">Email</label><br>
      <input type="text" id="email" placeholder="Enter email:"/>
      <div class="emailError error"></div>
      <br>

      <label for="phone">Phone</label><br>
      <input type="text" id="phone" placeholder="Enter phone:" />
      <div class="phoneError error"></div>
      <br>

      <label for="dob">Date of Birth</label><br>
      <input type="date" id="dob" placeholder="Enter DOB:" />
      <div class="dobError error"></div>
      <br>

      <label for="password">Password</label><br>
      <input type="password" id="password" placeholder="Enter password" />
      <div class="passwordError error"></div>
      <br>

      <label for="confirmPassword">Confirm Password</label><br>
      <input type="password" id="confirmPassword" placeholder="Confirm password:" />
      <div class="confirmPasswordError error"></div>
      <br>

      <label for="description">Description</label><br>
      <textarea id="description" placeholder="Enter description">jhjncjwcbjebcjs j njds bdj dsjn dn bd</textarea>
      <div class="descriptionError error"></div>
      <br>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
