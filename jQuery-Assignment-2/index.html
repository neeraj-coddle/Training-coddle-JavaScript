<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery Assignment-2</title>
    <script src="script/jquery-4.0.0.min.js"></script>
    <script src="script/script.js"></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <h2>Form</h2>

    <form id="signupForm">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter name:" />
        <div class="nameError error"></div>
      </div>
      <br>

      <div>
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter email:"/>
        <div class="emailError error"></div>
      </div>
      <br>


      <div>
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="Enter phone:" />
        <div class="phoneError error"></div>
      </div>
      <br>

      <div>
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" placeholder="Enter DOB:" />
        <div class="dobError error"></div>
      </div>
      <br>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" />
        <div class="passwordError error"></div>
      </div>
      <br>

      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password:" />
        <div class="confirmPasswordError error"></div>
      </div>
      <br>

      <div>
        <label for="description">Description</label>
        <textarea id="description" placeholder="Enter description"></textarea>
        <div class="descriptionError error"></div>
      </div>
      <br>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
